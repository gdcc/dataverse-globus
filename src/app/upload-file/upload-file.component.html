<div class="uploadfilecontainer" (click)="fileInput.click()" appGlobus (onFileDropped)="uploadFile($event)">
  <input hidden type="file" #fileInput (change)="uploadFile($event.target.files)" webkitdirectory multiple directory/>
</div>
@for (file of files; track file; let i = $index) {
  <div  class="files-list">
    <p> {{ file }} </p>
    <button class="delete-file" (click)="deleteAttachment(i)">
      <img src="../../assets/recycleBin.png">
    </button>
  </div>
}
